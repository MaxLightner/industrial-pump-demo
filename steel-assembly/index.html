 float viewDepth(vec2 uv){float d=texture2D(tDepth,uv).r;return (uNear*uFar)/(uFar-d*(uFar-uNear));}
 void main(){vec3 rgb=texture2D(tDiffuse,vUv).rgb;float original=texture2D(tDepth,vUv).r;if(original>.99995){gl_FragColor=vec4(rgb,1.);return;}
 float dep=viewDepth(vUv);float occlusion=0.;float total=0.;
 for(int i=0;i<12;i++){
 float angle=float(i)*2.39996323;float r=(4.0+12.0*fract(float(i)*.6180339));
 vec2 off=vec2(cos(angle),sin(angle))*r/uResolution;
 float compare=texture2D(tDepth,vUv+off).r;
 if(compare>=.99995)continue;
 float other=viewDepth(vUv+off);float diff=dep-other;
 float delta=max(.0005,dep*.0025);
 occlusion+=smoothstep(delta,delta*12.,diff)*(1.-smoothstep(delta*12.,delta*65.,abs(diff)));
 total+=1.;}
 float ao=1.-uStrength*(occlusion/max(1.,total));gl_FragColor=vec4(rgb*ao,1.);

function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();let width=renderer.domElement.width,height=renderer.domElement.height;target.setSize(width,height);postMaterial.uniforms.uResolution.value.set(width,height);}
new ResizeObserver(resize).observe(viewport);resize();
const clock=new THREE.Clock();

function showError(text){status.hidden=false;el('progress').hidden=true;msg.textContent=text;el('localUpload').hidden=false;status.querySelector('strong').textContent='MODEL NOT AVAILABLE';}
const loader=new GLTFLoader();
function loadUrl(url){status.hidden=false;status.querySelector('strong').textContent='PREPARING 3D SCENE';msg.textContent='Loading polished steel assembly...';el('progress').hidden=false;el('localUpload').hidden=true;
 loader.load(url,g=>{try{onLoaded(g)}catch(e){showError(e.message);}},ev=>{if(ev.total>0)msg.textContent=`Loading CAD geometry · ${Math.round(100*ev.loaded/ev.total)}%`;},e=>showError('The GLB is not published in this path yet. You can open the model locally using the button below.'));}
async function loadPacked(){
 status.hidden=false;status.querySelector('strong').textContent='PREPARING 3D SCENE';msg.textContent='Loading compressed CAD assembly...';el('progress').hidden=false;el('localUpload').hidden=true;
 try {
  const response=await fetch('./assembly.glb.gz');
  if(!response.ok)throw Error('CAD download failed (HTTP '+response.status+')');
  let bytes=await response.arrayBuffer();
  const magic=new Uint8Array(bytes);
  if(magic[0]===31 && magic[1]===139){
   if(typeof DecompressionStream!=='function')throw Error('Compressed GLB is not supported by this browser');
   bytes=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  }
  loader.parse(bytes,'',g=>{try{onLoaded(g)}catch(e){showError(e?.message||String(e));}},e=>showError('Model parsing failed: '+(e?.message||String(e))));
 }catch(e){showError(e?.message||String(e));}
}
loadPacked();
el('modelFile').onchange=e=>{const f=e.target.files?.[0];if(f){const uri=URL.createObjectURL(f);loadUrl(uri);setTimeout(()=>URL.revokeObjectURL(uri),30000);}};
const drop=el('dropzone');for(const name of ['dragenter','dragover'])viewport.addEventListener(name,e=>{e.preventDefault();drop.classList.add('on')});for(const name of ['drop','dragleave'])viewport.addEventListener(name,e=>{e.preventDefault();drop.classList.remove('on');if(name==='drop'){const file=[...e.dataTransfer.files].find(f=>/\.glb$/i.test(f.name));if(file){const u=URL.createObjectURL(file);loadUrl(u);setTimeout(()=>URL.revokeObjectURL(u),30000);}}});
