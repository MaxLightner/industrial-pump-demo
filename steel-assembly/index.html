function makeDiamondPlateTextures(){
 const size=256, step=32;
 const colorCanvas=document.createElement('canvas');colorCanvas.width=colorCanvas.height=size;
 const bumpCanvas=document.createElement('canvas');bumpCanvas.width=bumpCanvas.height=size;
 const roughCanvas=document.createElement('canvas');roughCanvas.width=roughCanvas.height=size;

 for(let y=16;y<size+16;y+=step){for(let x=16;x<size+16;x+=step){drawDiamond(cc,x,y,'rgba(227,236,241,.86)','rgba(110,126,138,.62)');drawDiamond(rc,x,y,'rgb(170,170,170)','rgb(95,95,95)');drawDiamond(bc,x,y,'rgb(156,156,255)','rgb(100,100,255)');}}

 for(let y=0;y<size;y++){for(let x=0;x<size;x++){const dx=(h(x-1,y)-h(x+1,y))*1.8,dy=(h(x,y-1)-h(x,y+1))*1.8;

 };
 addPanel([-8,9,6],8,14,0xf2f7ff,3.4,-.22);
 addPanel([9,5,3],3.6,13,0xe8f3ff,2.8,.12);
 addPanel([1,11,-7],14,4,0xffffff,3.8,.05);
 addPanel([-7,1,-7],4,9,0x88b6d9,1.5,.17);

 addPanel([4,4,-9],1.6,10,0xffffff,3.0,0);

}
let envTexture=studioEnvironment();scene.environment=envTexture;scene.environmentIntensity=2.6;
const key=new THREE.DirectionalLight(0xf7faff,4.4);key.position.set(-5,10,7);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.bias=-.00015;key.shadow.normalBias=.015;key.shadow.radius=3;scene.add(key);
const fill=new THREE.DirectionalLight(0xd9ebff,3.25);fill.position.set(8,3,-3);scene.add(fill);
const rim=new THREE.DirectionalLight(0xffffff,2.35);rim.position.set(2,8,-9);scene.add(rim);
function transparentPlastic(){

}
function polishedRailMaterial(){return new THREE.MeshPhysicalMaterial({color:0xf1f6f8,metalness:1,roughness:.08,envMapIntensity:2.35,clearcoat:.28,clearcoatRoughness:.08});}
function trayPlateMaterial(){return new THREE.MeshStandardMaterial({map:plateMaps.color,normalMap:plateMaps.normal,normalScale:new THREE.Vector2(.85,.85),roughnessMap:plateMaps.rough,roughness:.52,metalness:.83,envMapIntensity:1.6,color:0xe1e9ed});}
function buildTrayUV(mesh){
 const geo=mesh.geometry, pos=geo.getAttribute('position');
 if(!pos)throw Error('The original base plate has no geometry');
 geo.computeBoundingBox();const b=geo.boundingBox;
 const size=[b.max.x-b.min.x,b.max.y-b.min.y,b.max.z-b.min.z];
 const axes=[0,1,2].sort((a,b)=>size[b]-size[a]).slice(0,2);

 for(let i=0;i<pos.count;i++){uv[2*i]=(pos.getComponent(i,axes[0])-min[axes[0]])/Math.max(1e-6,size[axes[0]]);uv[2*i+1]=(pos.getComponent(i,axes[1])-min[axes[1]])/Math.max(1e-6,size[axes[1]]);}

}
function valveMaterial(name){
 const n=name.toLowerCase();
 if(n.includes('mirrorproval')||n.includes('-m2')) return new THREE.MeshPhysicalMaterial({color:0xe67a2c,metalness:.42,roughness:.36,envMapIntensity:1.25,clearcoat:.22,clearcoatRoughness:.18});
 if(n.includes('-p')||n.includes('-m11')) return new THREE.MeshPhysicalMaterial({color:0xd6dde1,metalness:1,roughness:.2,envMapIntensity:1.75,clearcoat:.08,clearcoatRoughness:.16});

}
function defaultMetal(name){
 const n=name.toLowerCase();const fastener=/bolt|nut|washer|screw|pin|stud|spring|ring|din|iso|hex/.test(n);
 const darker=/rubber|seal|gasket|oring|o-ring|plastic/.test(n);

 return new THREE.MeshPhysicalMaterial({color:darker?0x262a2d:fastener?0xaab6bd:polished?0xdce4e8:0xc5d0d5,metalness:darker?0:1,roughness:darker?.65:fastener?.31:polished?.16:.235,envMapIntensity:darker?.45:1.75,clearcoat:darker?0:.12,clearcoatRoughness:.18,side:THREE.FrontSide});

function meshKey(o){return String(o.name||o.parent?.name||'').toLowerCase().replace(/[^a-z0-9]+/g,'')}
function createMaterial(mesh){

 if(n.includes('300mirrorprovaldn125m2')||n.includes('300provaldn125m2'))return new THREE.MeshPhysicalMaterial({color:0xff8126,metalness:.32,roughness:.27,clearcoat:.7,clearcoatRoughness:.14,envMapIntensity:1.65});
 if(n.includes('300proval')||n.includes('300mirrorproval')){
  if(n.includes('m11')||n.endsWith('p')||n.includes('dn125l'))return new THREE.MeshStandardMaterial({color:0xe3e9ee,metalness:.96,roughness:.2,envMapIntensity:1.8});

 }
 if(n.includes('newobject010')){buildTrayUV(mesh);return trayPlateMaterial();}

}
let center=new THREE.Vector3(),distance=4,model=null,rotating=false,aoEnabled=false;
let processGroup=null,powderPoints=null,powderPositions=null,powderSeeds=null,powderFlow=null;

const tempBox=new THREE.Box3();
function frame(){const aspect=viewport.clientWidth/viewport.clientHeight;const fitHeight=distance/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2));const fitWidth=fitHeight/Math.max(.5,aspect);const d=Math.max(fitHeight,fitWidth)*1.3;camera.position.copy(center).add(new THREE.Vector3(.85,.52,1).normalize().multiplyScalar(d));controls.target.copy(center);controls.minDistance=d*.28;controls.maxDistance=d*4;controls.update();}
function findMeshes(fragment){const found=[];model?.traverse(o=>{if(o.isMesh&&meshKey(o).includes(fragment))found.push(o)});return found}
function clearProcessVisuals(){
 if(processGroup){scene.remove(processGroup);processGroup.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose?.()});}
 processGroup=null;powderSystems=[];
}
let powderSystems=[];
function fillMaterial(){return new THREE.MeshStandardMaterial({color:0xf9f8f1,metalness:0,roughness:.97,side:THREE.DoubleSide});}
function addPowderParticles(bounds,radius,count){

 for(let i=0;i<seed.length;i++)seed[i]=Math.random();

 const mat=new THREE.PointsMaterial({color:0xffffff,size:window.innerWidth<700?.017:.019,transparent:true,opacity:.92,depthTest:true,depthWrite:false,sizeAttenuation:true,toneMapped:false});

}
function buildProcessVisuals(){
 clearProcessVisuals();if(!model)return;
 processGroup=new THREE.Group();scene.add(processGroup);
 const tubes=findMeshes('stpshmhf04'),tanks=findMeshes('stpshmhf02');
 const hopperRoots=[...findMeshes('newobject001'),...findMeshes('newobject068')].filter((x,i,a)=>a.indexOf(x)===i);

 for(const h of (hasUserPowderSurfaces?[]:hopperRoots)){
  const b=new THREE.Box3().setFromObject(h),d=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());

  const b=new THREE.Box3().setFromObject(t),d=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());

function updatePowder(_dt,time){
 for(const sys of powderSystems){
  const {positions,seed,particle,bounds,center,radius}=sys;
  for(let i=0;i<seed.length/4;i++){
   const k=i*4,j=i*3,t=(seed[k]+time*(.25+.28*seed[k+3]))%1;

}
function onLoaded(gltf){

const loader=new GLTFLoader();

async function loadPacked(){
 status.hidden=false;status.querySelector('strong').textContent='PREPARING 3D SCENE';msg.textContent='Loading compressed CAD assembly...';el('progress').hidden=false;el('localUpload').hidden=true;
 try {
  const response=await fetch('./assembly_styled.glb.gz?v=7');
  if(!response.ok)throw Error('CAD download failed (HTTP '+response.status+')');
  let bytes=await response.arrayBuffer();
  const magic=new Uint8Array(bytes);
  if(magic[0]===31 && magic[1]===139){
   if(typeof DecompressionStream!=='function')throw Error('Compressed GLB is not supported by this browser');
   bytes=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  }
  loader.parse(bytes,'',g=>{try{onLoaded(g)}catch(e){showError(e?.message||String(e));}},e=>showError('Model parsing failed: '+(e?.message||String(e))));
 }catch(e){showError(e?.message||String(e));}
}
