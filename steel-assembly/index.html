<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#121d26"/><title>Steel Assembly | Industrial WebGL</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101720;color:#e5edf3;font-family:Inter,system-ui,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #a8e2ff;outline-offset:3px}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 46%,#334651 0%,#16232e 57%,#090f16 100%);touch-action:none}#stage canvas{display:block;width:100%;height:100%;touch-action:none}
header{position:absolute;z-index:5;top:25px;left:clamp(20px,4vw,64px);right:clamp(20px,4vw,64px);display:flex;align-items:center;justify-content:space-between;pointer-events:none}header>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:13px}.symbol{width:38px;height:38px;display:grid;place-items:center;border:1px solid #a2c4d1;color:#d6e9f1;font-size:29px}.eyebrow{font-size:10px;letter-spacing:.26em;color:#a2b8c6;font-weight:700}.brand h1{font-size:clamp(15px,2.1vw,23px);font-weight:600;margin:4px 0 0}.tag{color:#b4c7d3;letter-spacing:.18em;font-size:10px;border:1px solid #65778499;padding:12px 16px;background:#16222db0}
.number{position:absolute;z-index:1;left:clamp(20px,4vw,64px);top:50%;transform:translateY(-50%);pointer-events:none}.number b{font-size:clamp(65px,13vw,164px);color:#cbdfe918;font-weight:600;line-height:1}.number span{display:block;font-size:10px;letter-spacing:.3em;color:#9cb6c5}
.tools{position:absolute;z-index:5;right:clamp(15px,3vw,46px);top:50%;transform:translateY(-50%);display:grid;gap:8px}.tools button{width:43px;height:43px;border:1px solid #77909d55;border-radius:6px;background:#15232dcf;color:#e8f4fa;font-size:23px;backdrop-filter:blur(10px)}.tools button:hover{background:#293b48}
footer{position:absolute;z-index:5;bottom:clamp(15px,4vh,46px);left:clamp(20px,4vw,64px);right:clamp(20px,4vw,64px);display:flex;align-items:end;justify-content:space-between;gap:12px}.caption{color:#a5bac8;font-size:11px;line-height:1.8}.caption strong{color:#e3eef4;font-size:12px;font-weight:550;letter-spacing:.08em}.panel{display:flex;align-items:center;gap:19px;padding:15px 18px;border:1px solid #8c9daa42;background:#111e29db;backdrop-filter:blur(18px);font-size:12px}.panel button{background:transparent;color:#e7f2f9;border:0}.switch{display:flex;align-items:center;gap:10px;white-space:nowrap}.toggle{width:35px;height:20px;border-radius:16px!important;background:#55616b!important;border:1px solid #8996a0!important;position:relative}.toggle:before{content:"";position:absolute;top:2px;left:3px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .2s}.toggle[aria-checked=true]{background:#588698!important}.toggle[aria-checked=true]:before{transform:translateX(15px)}.sep{height:22px;width:1px;background:#ffffff29}
#loading{position:absolute;z-index:10;top:50%;left:50%;transform:translate(-50%,-50%);min-width:230px;max-width:calc(100% - 30px);background:#101c27ed;border:1px solid #8b9ca847;padding:24px;text-align:center;box-shadow:0 14px 50px #05080d5e}#loading[hidden]{display:none}#loading strong{font-size:13px;letter-spacing:.1em;font-weight:600}#loading p{color:#afc1ce;font-size:12px;line-height:1.7}#local{display:inline-block;background:#254357;border:1px solid #7498a7;color:white;padding:10px 15px;font-size:12px;cursor:pointer}#local[hidden]{display:none}#local input{display:none}
@media(max-width:700px){header{top:18px;left:16px;right:16px}.tag{display:none}.symbol{width:32px;height:32px}.brand h1{font-size:16px}.eyebrow{font-size:9px}.number{left:16px;top:28%}.number b{font-size:80px}.tools{right:12px}.tools button{width:40px;height:40px}footer{left:15px;right:15px;bottom:max(16px,env(safe-area-inset-bottom));display:block}.caption{margin-bottom:12px}.panel{justify-content:space-between;padding:13px}.sep{display:none}}
</style><script type="importmap">{"imports":{"three":"../three.module.js"}}</script></head>
<body><div id="stage"></div><header><div class="brand"><div class="symbol">◇</div><div><div class="eyebrow">INDUSTRIAL / WEBGL</div><h1>Steel Assembly</h1></div></div><div class="tag">3D SHOWCASE — 02</div></header>
<div class="number"><b>02</b><span>ENGINEERED IN METAL</span></div><aside class="tools"><button id="plus" title="Zoom in" aria-label="Zoom in">+</button><button id="minus" title="Zoom out" aria-label="Zoom out">−</button><button id="reset" title="Reset view" aria-label="Reset view">↺</button><button id="fullscreen" title="Fullscreen" aria-label="Fullscreen">⛶</button></aside>
<footer><div class="caption"><strong>STAINLESS STEEL · STUDIO FINISH</strong><div id="details">Drag to rotate · Scroll to zoom</div></div><div class="panel"><label class="switch"><button role="switch" class="toggle" id="ao" aria-checked="true" aria-label="Ambient occlusion"></button>Ambient occlusion</label><span class="sep"></span><button id="rotate">Auto rotate</button></div></footer>
<div id="loading" role="status"><strong id="loadTitle">PREPARING 3D SCENE</strong><p id="loadText">Loading stainless steel assembly...</p><label id="local" hidden>Open local GLB<input type="file" id="file" accept=".glb"></label></div>
<script type="module">
import * as T from 'three';
import {GLTFLoader} from '../GLTFLoader.js';
import {OrbitControls} from '../OrbitControls.js';
const $=id=>document.getElementById(id),stage=$('stage'),loading=$('loading');
const renderer=new T.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<700?1.5:2));renderer.outputColorSpace=T.SRGBColorSpace;
renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.23;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x17232c);const camera=new T.PerspectiveCamera(35,1,.01,250);let size=3,center=new T.Vector3(),model=null,rotating=false,ao=true;
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;controls.screenSpacePanning=true;controls.minPolarAngle=.05;controls.maxPolarAngle=Math.PI-.05;
const group=new T.Group();scene.add(group);
const floor=new T.Mesh(new T.PlaneGeometry(100,100),new T.ShadowMaterial({color:0x03080b,opacity:.27}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
// Procedural softboxes reflected by PBR steel, no external HDR files required.
function studio(){
 const s=new T.Scene();s.background=new T.Color(0x111b25);
 const shell=new T.Mesh(new T.BoxGeometry(60,60,60),new T.MeshBasicMaterial({color:0x172631,side:T.BackSide}));s.add(shell);
 const panel=(x,y,z,w,h,c,intensity,angle=0)=>{
 const p=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:new T.Color(c).multiplyScalar(intensity),side:T.DoubleSide,toneMapped:false}));
 p.position.set(x,y,z);p.lookAt(0,0,0);p.rotateZ(angle);s.add(p);
 };
 panel(-8,9,6,8,14,0xf2f7ff,3.5,-.2);panel(9,5,3,3.6,13,0xe8f3ff,2.8,.1);
 panel(1,11,-7,14,4,0xffffff,3.8);panel(-7,1,-7,4,9,0x93bbd7,1.8);
 panel(3,-1,9,10,2.3,0xe6eeff,1.4);panel(4,4,-9,1.6,10,0xffffff,3.0);
 const pmrem=new T.PMREMGenerator(renderer);const tex=pmrem.fromScene(s,.035,.1,40).texture;pmrem.dispose();return tex;
}
scene.environment=studio();scene.environmentIntensity=1.5;scene.add(new T.AmbientLight(0xdceaff,.2));
const key=new T.DirectionalLight(0xfafcff,3);key.position.set(-5,10,7);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.normalBias=.015;key.shadow.radius=3;scene.add(key);
const rim=new T.DirectionalLight(0xaacdec,2);rim.position.set(7,3,-4);scene.add(rim);
const back=new T.DirectionalLight(0xffffff,1.5);back.position.set(2,7,-8);scene.add(back);
function metal(name){
 const n=name.toLowerCase(),bolt=/bolt|nut|washer|screw|stud|spring|ring|din|iso|hex/.test(n),seal=/rubber|gasket|seal|plastic/.test(n),polished=/mirror|flange|shaft|pipe|300-proval/.test(n);
 return new T.MeshPhysicalMaterial({color:seal?0x30353a:bolt?0xa9b4bd:polished?0xdce4e8:0xc3ced6,metalness:seal?0:1,roughness:seal?.65:bolt?.3:polished?.16:.24,envMapIntensity:seal?.5:1.65,clearcoat:seal?0:.12,clearcoatRoughness:.2});
}
function frame(){
 const aspect=stage.clientWidth/stage.clientHeight,halfHeight=size/(2*Math.tan(T.MathUtils.degToRad(camera.fov)/2)),dist=Math.max(halfHeight,halfHeight/Math.max(.55,aspect))*1.25;
 camera.position.copy(center).add(new T.Vector3(.84,.52,1).normalize().multiplyScalar(dist));controls.target.copy(center);controls.minDistance=dist*.25;controls.maxDistance=dist*4;controls.update();
}
function setup(g){
 if(model){group.remove(model);model.traverse(o=>{if(o.isMesh)o.material.dispose();});}
 model=g.scene;let count=0;model.traverse(o=>{if(!o.isMesh)return;o.material=metal(o.name||o.parent?.name||'');o.castShadow=true;o.receiveShadow=true;count++;});
 group.add(model);let bbox=new T.Box3().setFromObject(model),dims=bbox.getSize(new T.Vector3()),extent=Math.max(dims.x,dims.y,dims.z);
 if(!Number.isFinite(extent)||extent<=0)throw Error('Invalid CAD geometry.');
 model.scale.multiplyScalar(3/extent);bbox.setFromObject(model);dims=bbox.getSize(new T.Vector3());center=bbox.getCenter(new T.Vector3());size=Math.max(dims.x,dims.y,dims.z);
 floor.position.set(center.x,bbox.min.y-.01,center.z);key.target.position.copy(center);scene.add(key.target);key.position.copy(center).add(new T.Vector3(-6,10,7));
 const radius=size*2.3;Object.assign(key.shadow.camera,{left:-radius,right:radius,top:radius,bottom:-radius,near:.05,far:radius*8});key.shadow.camera.updateProjectionMatrix();
 $('details').textContent=count+' CAD meshes · Drag to rotate · Scroll to zoom';frame();loading.hidden=true;
}
// Depth-sample-based screen space ambient occlusion pass (12 neighborhood taps).
const rt=new T.WebGLRenderTarget(1,1,{depthBuffer:true,stencilBuffer:false});rt.depthTexture=new T.DepthTexture(1,1);rt.depthTexture.type=T.UnsignedIntType;
const post=new T.Scene(),postCamera=new T.OrthographicCamera(-1,1,1,-1,0,1);
const pp=new T.ShaderMaterial({depthTest:false,depthWrite:false,uniforms:{image:{value:rt.texture},depth:{value:rt.depthTexture},res:{value:new T.Vector2(1,1)},near:{value:camera.near},far:{value:camera.far},intensity:{value:.5}},
 vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.,1.);}',
 fragmentShader:`
 precision highp float;
 uniform sampler2D image,depth;uniform vec2 res;uniform float near,far,intensity;varying vec2 v;
 float distanceAt(vec2 uv){float d=texture2D(depth,uv).r;return near*far/(far-d*(far-near));}
 void main(){
 vec3 color=texture2D(image,v).rgb;float original=texture2D(depth,v).r;
 float occ=0.,valid=0.;
 if(original<.99995){
 float cd=distanceAt(v);
 for(int i=0;i<12;i++){
 float a=float(i)*2.39996323,r=4.+12.*fract(float(i)*.618034);
 vec2 uv=v+vec2(cos(a),sin(a))*r/res;
 float sd=texture2D(depth,uv).r;
 if(sd>=.99995)continue;
 float diff=cd-distanceAt(uv),delta=max(.0005,cd*.0025);
 occ+=smoothstep(delta,delta*12.,diff)*(1.-smoothstep(delta*12.,delta*65.,abs(diff)));valid+=1.;
 }}
 gl_FragColor=vec4(color*(1.-intensity*occ/max(1.,valid)),1.);
 #include <colorspace_fragment>
 }`});
post.add(new T.Mesh(new T.PlaneGeometry(2,2),pp));
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();rt.setSize(renderer.domElement.width,renderer.domElement.height);pp.uniforms.res.value.set(renderer.domElement.width,renderer.domElement.height);}
new ResizeObserver(resize).observe(stage);resize();
function render(){requestAnimationFrame(render);controls.autoRotate=rotating;controls.autoRotateSpeed=.7;controls.update();if(ao&&model){renderer.setRenderTarget(rt);renderer.render(scene,camera);renderer.setRenderTarget(null);renderer.render(post,postCamera);}else{renderer.setRenderTarget(null);renderer.render(scene,camera);}}render();
$('ao').onclick=()=>{ao=!ao;$('ao').setAttribute('aria-checked',String(ao));};
$('rotate').onclick=()=>{rotating=!rotating;$('rotate').textContent=rotating?'Stop rotation':'Auto rotate';};
$('plus').onclick=()=>{camera.position.sub(controls.target).multiplyScalar(.77).add(controls.target);controls.update();};
$('minus').onclick=()=>{camera.position.sub(controls.target).multiplyScalar(1.3).add(controls.target);controls.update();};
$('reset').onclick=frame;
$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.();};
const loader=new GLTFLoader();
function load(url){loading.hidden=false;$('loadTitle').textContent='PREPARING 3D SCENE';$('loadText').textContent='Loading stainless steel assembly...';$('local').hidden=true;
 loader.load(url,g=>{try{setup(g)}catch(e){error(e.message);}},event=>{if(event.total)$('loadText').textContent='Loading geometry · '+Math.round(100*event.loaded/event.total)+'%';},()=>error('The assembly GLB is not yet uploaded. Select your local model to preview this viewer.'));}
function error(message){loading.hidden=false;$('loadTitle').textContent='MODEL NOT AVAILABLE';$('loadText').textContent=message;$('local').hidden=false;}
load('./assembly.glb');
$('file').onchange=e=>{const f=e.target.files?.[0];if(f){const url=URL.createObjectURL(f);load(url);setTimeout(()=>URL.revokeObjectURL(url),30000);}};
['dragover','drop'].forEach(name=>stage.addEventListener(name,e=>{e.preventDefault();if(name==='drop'){const f=[...e.dataTransfer.files].find(x=>/\.glb$/i.test(x.name));if(f){const url=URL.createObjectURL(f);load(url);setTimeout(()=>URL.revokeObjectURL(url),30000);}}}));
</script></body></html>
